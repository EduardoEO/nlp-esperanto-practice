[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esperanto-nlp"
version = "0.3.1"
description = "Librería de NLP para Esperanto basada en reglas, con API estilo spaCy (práctica de Minería de Textos, CUNEF)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Equipo de Minería de Textos - CUNEF" }]
keywords = ["nlp", "esperanto", "tokenizer", "lemmatizer", "pos-tagging", "rule-based"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Esperanto",
    "Topic :: Text Processing :: Linguistic",
]
# El núcleo no depende de NINGUNA librería externa (el enunciado prohíbe usar librerías de NLP).
dependencies = []

[project.optional-dependencies]
etl = ["requests>=2.25"]
notebook = ["pandas>=1.5", "scikit-learn>=1.1", "matplotlib>=3.5", "beautifulsoup4>=4.11", "requests>=2.25"]
runner = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
test = ["pytest>=7", "pytest-cov>=4"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Homepage = "https://github.com/EduardoEO/nlp-esperanto-practice"
Repository = "https://github.com/EduardoEO/nlp-esperanto-practice"
Issues = "https://github.com/EduardoEO/nlp-esperanto-practice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = ""

[tool.pyrefly]
search-path = ["src", "scripts"]

