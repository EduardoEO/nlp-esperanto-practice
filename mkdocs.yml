site_name: NLP Esperanto Docs
site_description: Documentación de la librería de NLP en Esperanto
site_author: Eduardo Estefanía, Ignacio Bravo y Alejandro Jesús Castro
repo_url: https://github.com/EduardoEO/nlp-esperanto-practice
repo_name: EduardoEO/nlp-esperanto-practice

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google

nav:
  - Inicio: index.md
  - Guía rápida: guia-rapida.md
  - Decisiones de diseño: decisiones-diseno.md
  - Gramática implementada: gramatica.md
  - Dataset: dataset.md
  - Referencia de la API: api.md
